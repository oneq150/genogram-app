<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가계도 그리기 — 사회복지 실천 도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E9EDEF;
    --panel: #FFFFFF;
    --canvas: #FCFCFB;
    --grid-dot: #D7DEE1;
    --ink: #1F2933;
    --ink-soft: #5B6672;
    --line: #C6CFD3;
    --accent: #2F6F5E;
    --accent-soft: #E4EFEC;
    --male: #2B3A55;
    --female: #7A3B69;
    --danger: #B0413E;
    --danger-soft: #F6E7E6;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Noto Sans KR', sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .serif{font-family:'Noto Serif KR', serif;}

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .menu-toggle{
    display:none; border:1px solid var(--line); background:var(--panel); border-radius:8px;
    width:36px; height:36px; font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .brand .clip{
    width:26px;height:32px; border:2px solid var(--ink); border-radius:3px; position:relative;
    background:linear-gradient(var(--panel),var(--panel));
  }
  .brand .clip::before{
    content:''; position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:14px; height:9px; border:2px solid var(--ink); border-bottom:none; border-radius:4px 4px 0 0; background:var(--panel);
  }
  .brand h1{font-family:'Noto Serif KR',serif; font-size:17px; font-weight:700; margin:0; letter-spacing:-0.2px;}
  .brand p{margin:0; font-size:11px; color:var(--ink-soft);}
  .header-actions{display:flex; align-items:center; gap:8px;}
  .save-status{font-size:11px; color:var(--ink-soft); margin-right:6px; font-family:'IBM Plex Mono',monospace;}
  button.btn{
    font-family:'Noto Sans KR', sans-serif;
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    padding:8px 13px; border-radius:8px; font-size:12.5px; font-weight:500; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:background .12s, border-color .12s;
  }
  button.btn:hover{background:var(--accent-soft); border-color:var(--accent);}
  button.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.btn.primary:hover{opacity:.9;}
  button.btn.danger{color:var(--danger); border-color:var(--danger-soft);}
  button.btn.danger:hover{background:var(--danger-soft);}
  button.btn:disabled{opacity:.4; cursor:not-allowed;}

  /* ---------- Layout ---------- */
  .layout{flex:1; display:flex; min-height:0;}

  /* ---------- Left tool rail ---------- */
  .rail{
    width:190px; background:var(--panel); border-right:1px solid var(--line);
    padding:14px 12px; overflow-y:auto; flex-shrink:0;
  }
  .rail h2{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin:16px 0 8px; font-weight:700;}
  .rail h2:first-child{margin-top:0;}
  .palette-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .pal-item{
    border:1px solid var(--line); border-radius:8px; background:var(--canvas);
    padding:8px 4px 6px; display:flex; flex-direction:column; align-items:center; gap:4px;
    cursor:grab; font-size:10.5px; color:var(--ink-soft); user-select:none;
  }
  .pal-item:active{cursor:grabbing;}
  .pal-item:hover{border-color:var(--accent); background:var(--accent-soft);}
  .pal-item svg{pointer-events:none;}

  .tool-list{display:flex; flex-direction:column; gap:4px;}
  .tool-btn{
    display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:7px;
    border:1px solid transparent; background:none; cursor:pointer; font-size:12px; text-align:left; color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
  }
  .tool-btn:hover{background:var(--accent-soft);}
  .tool-btn.active{background:var(--accent); color:#fff;}
  .tool-btn .swatch{width:26px; height:14px; flex-shrink:0;}

  select.mini, input.mini{
    width:100%; font-size:12px; padding:6px 7px; border-radius:6px; border:1px solid var(--line);
    font-family:'Noto Sans KR',sans-serif; background:#fff; color:var(--ink);
  }

  /* ---------- Canvas area ---------- */
  .canvas-wrap{flex:1; position:relative; overflow:auto; background:var(--canvas);}
  .canvas-wrap.dragover{outline:2px dashed var(--accent); outline-offset:-2px;}
  .dotgrid{
    background-image: radial-gradient(var(--grid-dot) 1.2px, transparent 1.2px);
    background-size: 26px 26px;
  }
  svg#stage{display:block;}
  .hint-banner{
    position:absolute; top:12px; left:50%; transform:translateX(-50%);
    background:rgba(31,41,51,.92); color:#fff; padding:8px 16px; border-radius:20px;
    font-size:12.5px; z-index:15; pointer-events:none; white-space:nowrap;
  }
  .zoom-ctrl{
    position:absolute; bottom:16px; left:16px; display:flex; gap:4px; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; padding:4px; z-index:15;
  }
  .zoom-ctrl button{width:28px; height:28px; border:none; background:none; cursor:pointer; font-size:15px; border-radius:5px; color:var(--ink);}
  .zoom-ctrl button:hover{background:var(--accent-soft);}
  .zoom-ctrl span{font-size:11px; align-self:center; width:40px; text-align:center; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

  /* node/edge svg helpers */
  .node-group{cursor:grab;}
  .node-group:active{cursor:grabbing;}
  .node-shape{fill:#fff; stroke:var(--ink); stroke-width:2.4;}
  .node-shape.male{stroke:var(--male);}
  .node-shape.female{stroke:var(--female);}
  .node-shape.selected{stroke:var(--accent); stroke-width:3.2; filter:drop-shadow(0 0 0 rgba(0,0,0,0));}
  .quad-fill{fill:var(--ink); opacity:.82;}
  .node-label-name{font-family:'Noto Sans KR',sans-serif; font-size:13px; font-weight:700; fill:var(--ink);}
  .node-label-year{font-family:'IBM Plex Mono',monospace; font-size:10.5px; fill:var(--ink-soft);}
  .edge-line{fill:none; stroke:var(--ink); stroke-width:2;}
  .edge-hit{fill:none; stroke:transparent; stroke-width:14; cursor:pointer;}
  .edge-line.selected, .edge-hit.selected + .edge-line{stroke:var(--accent);}
  .edge-label{font-family:'IBM Plex Mono',monospace; font-size:10px; fill:var(--ink-soft);}
  .child-line{fill:none; stroke:var(--ink); stroke-width:2;}
  .pending-line{fill:none; stroke:var(--accent); stroke-width:2; stroke-dasharray:5 4;}

  /* ---------- Right context panel ---------- */
  .panel{
    width:270px; background:var(--panel); border-left:1px solid var(--line);
    padding:16px; overflow-y:auto; flex-shrink:0; display:none;
  }
  .panel.open{display:block;}
  .panel h3{font-size:13px; margin:0 0 12px; font-weight:700; display:flex; align-items:center; gap:6px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; font-weight:500;}
  .field-row{display:flex; gap:8px;}
  .field-row .field{flex:1;}
  .checkline{display:flex; align-items:center; gap:7px; margin-bottom:9px; font-size:12.5px;}
  .checkline input{width:15px; height:15px;}
  .panel-actions{display:flex; flex-direction:column; gap:8px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line);}

  /* legend */
  .legend{margin-top:8px; display:flex; flex-direction:column; gap:6px; font-size:11.5px; color:var(--ink-soft);}
  .legend .row{display:flex; align-items:center; gap:8px;}
  .legend svg{flex-shrink:0;}

  details.helpbox{border:1px solid var(--line); border-radius:8px; margin-bottom:10px; background:var(--canvas);}
  details.helpbox summary{padding:9px 11px; cursor:pointer; font-size:12px; font-weight:700; list-style:none;}
  details.helpbox summary::-webkit-details-marker{display:none;}
  details.helpbox summary::before{content:'▸ '; color:var(--accent);}
  details.helpbox[open] summary::before{content:'▾ ';}
  details.helpbox .inner{padding:0 11px 11px; font-size:11.5px; color:var(--ink-soft); line-height:1.6;}

  /* modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(31,41,51,.45); display:none; align-items:center; justify-content:center; z-index:100;
  }
  .modal-backdrop.open{display:flex;}
  .modal{background:#fff; border-radius:12px; padding:20px; width:320px; box-shadow:0 12px 40px rgba(0,0,0,.2);}
  .modal h3{margin:0 0 14px; font-size:14.5px; font-family:'Noto Serif KR',serif;}
  .modal .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .seg{display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden;}
  .seg button{flex:1; border:none; background:#fff; padding:7px 0; font-size:12px; cursor:pointer; font-family:'Noto Sans KR',sans-serif;}
  .seg button.active{background:var(--accent); color:#fff;}
  .seg button + button{border-left:1px solid var(--line);}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#c7cfd3; border-radius:6px;}

  /* ---------- touch support ---------- */
  .node-group{touch-action:none;}
  .pal-item{touch-action:none; -webkit-user-select:none; user-select:none;}
  .edge-hit{touch-action:none;}
  .drag-ghost{
    position:fixed; pointer-events:none; z-index:200; opacity:.85;
    transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center;
  }

  .rail-backdrop, .panel-backdrop{
    display:none; position:fixed; inset:0; background:rgba(31,41,51,.35); z-index:24;
  }
  .rail-backdrop.show, .panel-backdrop.show{display:block;}

  /* ---------- responsive (tablet / phone) ---------- */
  @media (max-width: 900px){
    .menu-toggle{display:block;}
    .brand p{display:none;}
    header{padding:8px 10px; gap:8px;}
    .brand h1{font-size:15px;}
    .header-actions{overflow-x:auto; max-width:56vw; -webkit-overflow-scrolling:touch;}
    .header-actions button.btn{white-space:nowrap; padding:8px 10px; font-size:12px;}
    .save-status{display:none;}

    .rail{
      position:fixed; top:0; bottom:0; left:0; width:78vw; max-width:300px;
      transform:translateX(-100%); transition:transform .2s ease; z-index:25;
    }
    .rail.open{transform:translateX(0);}

    .panel{
      position:fixed; top:0; bottom:0; right:0; width:82vw; max-width:320px;
      transform:translateX(100%); transition:transform .2s ease; z-index:25;
      display:block !important;
    }
    .panel.open{transform:translateX(0);}
    .panel:not(.open){transform:translateX(100%);}

    .zoom-ctrl{bottom:10px; left:10px;}
    .hint-banner{font-size:11.5px; padding:7px 12px; max-width:90vw; white-space:normal; text-align:center;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <button class="menu-toggle" id="menuToggle" aria-label="도구 메뉴 열기">☰</button>
    <div class="clip"></div>
    <div>
      <h1>가계도 그리기</h1>
      <p>사회복지 실천현장용 3세대 제노그램 도구</p>
    </div>
  </div>
  <div class="header-actions">
    <span class="save-status" id="saveStatus">불러오는 중…</span>
    <button class="btn" id="btnTemplate2">📋 2세대 예시 불러오기</button>
    <button class="btn" id="btnTemplate">📋 3세대 예시 불러오기</button>
    <button class="btn" id="btnExport">⬇ 이미지 저장</button>
    <button class="btn danger" id="btnReset">초기화</button>
  </div>
</header>
<div class="rail-backdrop" id="railBackdrop"></div>

<div class="layout">

  <!-- LEFT RAIL -->
  <aside class="rail">
    <h2>인물 도형 (끌어서 놓기)</h2>
    <div class="palette-grid">
      <div class="pal-item" data-add="male">
        <svg width="34" height="34"><rect x="4" y="4" width="26" height="26" fill="#fff" stroke="var(--male)" stroke-width="2.2"/></svg>
        남성
      </div>
      <div class="pal-item" data-add="female">
        <svg width="34" height="34"><circle cx="17" cy="17" r="13" fill="#fff" stroke="var(--female)" stroke-width="2.2"/></svg>
        여성
      </div>
      <div class="pal-item" data-add="male-client">
        <svg width="34" height="34"><rect x="3" y="3" width="28" height="28" fill="#fff" stroke="var(--male)" stroke-width="1.6"/><rect x="7" y="7" width="20" height="20" fill="#fff" stroke="var(--male)" stroke-width="2.2"/></svg>
        대상자(남)
      </div>
      <div class="pal-item" data-add="female-client">
        <svg width="34" height="34"><circle cx="17" cy="17" r="15" fill="#fff" stroke="var(--female)" stroke-width="1.6"/><circle cx="17" cy="17" r="10" fill="#fff" stroke="var(--female)" stroke-width="2.2"/></svg>
        대상자(여)
      </div>
    </div>

    <h2>부부관계선</h2>
    <div class="tool-list">
      <button class="tool-btn" data-tool="couple:marriage"><svg class="swatch" width="26" height="14"><line x1="1" y1="7" x2="25" y2="7" stroke="var(--ink)" stroke-width="2"/></svg> 결혼 (m)</button>
      <button class="tool-btn" data-tool="couple:cohabit"><svg class="swatch" width="26" height="14"><line x1="1" y1="7" x2="25" y2="7" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 3"/></svg> 동거 (lt)</button>
      <button class="tool-btn" data-tool="couple:separated"><svg class="swatch" width="26" height="14"><line x1="1" y1="7" x2="25" y2="7" stroke="var(--ink)" stroke-width="2"/><line x1="12" y1="2" x2="8" y2="12" stroke="var(--ink)" stroke-width="2"/></svg> 별거 (s)</button>
      <button class="tool-btn" data-tool="couple:divorced"><svg class="swatch" width="26" height="14"><line x1="1" y1="7" x2="25" y2="7" stroke="var(--ink)" stroke-width="2"/><line x1="10" y1="2" x2="6" y2="12" stroke="var(--ink)" stroke-width="2"/><line x1="16" y1="2" x2="12" y2="12" stroke="var(--ink)" stroke-width="2"/></svg> 이혼 (d)</button>
    </div>

    <h2>상호작용(관계) 표시</h2>
    <div class="tool-list">
      <button class="tool-btn" data-tool="bond:adequate"><svg class="swatch" width="26" height="14"><line x1="1" y1="7" x2="25" y2="7" stroke="var(--ink)" stroke-width="1.6"/></svg> 적절한 관계</button>
      <button class="tool-btn" data-tool="bond:close"><svg class="swatch" width="26" height="14"><line x1="1" y1="5" x2="25" y2="5" stroke="var(--ink)" stroke-width="1.6"/><line x1="1" y1="9" x2="25" y2="9" stroke="var(--ink)" stroke-width="1.6"/></svg> 친밀한 관계</button>
      <button class="tool-btn" data-tool="bond:fused"><svg class="swatch" width="26" height="14"><line x1="1" y1="3.5" x2="25" y2="3.5" stroke="var(--ink)" stroke-width="1.6"/><line x1="1" y1="7" x2="25" y2="7" stroke="var(--ink)" stroke-width="1.6"/><line x1="1" y1="10.5" x2="25" y2="10.5" stroke="var(--ink)" stroke-width="1.6"/></svg> 융합된 관계</button>
      <button class="tool-btn" data-tool="bond:conflict"><svg class="swatch" width="26" height="14"><polyline points="1,7 6,3 11,11 16,3 21,11 25,7" fill="none" stroke="var(--ink)" stroke-width="1.6"/></svg> 갈등 관계</button>
      <button class="tool-btn" data-tool="bond:distant"><svg class="swatch" width="26" height="14"><line x1="1" y1="7" x2="25" y2="7" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="2 3"/></svg> 소원한 관계</button>
      <button class="tool-btn" data-tool="bond:cutoff"><svg class="swatch" width="26" height="14"><line x1="1" y1="7" x2="25" y2="7" stroke="var(--ink)" stroke-width="1.6"/><line x1="9" y1="2" x2="7" y2="12" stroke="var(--ink)" stroke-width="1.6"/><line x1="17" y1="2" x2="15" y2="12" stroke="var(--ink)" stroke-width="1.6"/></svg> 단절된 관계</button>
    </div>

    <h2>생태도 표시 도구</h2>
    <div class="palette-grid" style="margin-bottom:10px;">
      <div class="pal-item" data-add="system">
        <svg width="34" height="34"><circle cx="17" cy="17" r="14" fill="#fff" stroke="var(--ink)" stroke-width="1.8"/></svg>
        체계(원)
      </div>
      <div class="pal-item" data-add="household">
        <svg width="34" height="34"><circle cx="17" cy="17" r="14" fill="none" stroke="var(--ink-soft)" stroke-width="1.8" stroke-dasharray="3 2"/></svg>
        가구 경계(투명)
      </div>
    </div>
    <div class="field" style="margin-bottom:8px;">
      <label style="display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px;">선 스타일</label>
      <select class="mini" id="ecoStyleSelect">
        <option value="solid">실선</option>
        <option value="dashed">점선</option>
        <option value="thick">굵은 실선</option>
      </select>
    </div>
    <div class="field" style="margin-bottom:8px;">
      <label style="display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px;">화살표 방향</label>
      <select class="mini" id="ecoArrowSelect">
        <option value="none">없음</option>
        <option value="both">양방향</option>
        <option value="left">왼쪽</option>
        <option value="right">오른쪽</option>
      </select>
    </div>
    <div class="tool-list">
      <button class="tool-btn" id="ecoConnectBtn" data-tool="eco">🔗 생태도 선 연결</button>
    </div>

    <h2>선택 도구</h2>
    <div class="tool-list">
      <button class="tool-btn active" data-tool="select">🖱 선택 / 이동</button>
    </div>

    <details class="helpbox" style="margin-top:16px;">
      <summary>사용 방법 보기</summary>
      <div class="inner">
        1) 도형을 캔버스로 끌어놓기<br>
        2) 도형 클릭 → 오른쪽 패널에서 이름·출생년도 등 입력<br>
        3) 관계선 도구 선택 → 인물 두 명 순서대로 클릭<br>
        4) 부부선 선택 후 오른쪽 패널의 "자녀 추가"로 세대 확장<br>
        5) 완성되면 "이미지 저장"으로 PNG 저장
      </div>
    </details>
  </aside>

  <!-- CANVAS -->
  <div class="canvas-wrap dotgrid" id="canvasWrap">
    <svg id="stage" width="1700" height="1150" viewBox="0 0 1700 1150">
      <defs>
        <marker id="ecoArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 Z" fill="#1F2933"></path>
        </marker>
      </defs>
      <g id="layerHousehold"></g>
      <g id="layerChild"></g>
      <g id="layerCouple"></g>
      <g id="layerBond"></g>
      <g id="layerEco"></g>
      <g id="layerPending"></g>
      <g id="layerNodes"></g>
    </svg>
    <div class="hint-banner" id="hintBanner" style="display:none;"></div>
    <div class="zoom-ctrl">
      <button id="zoomOut">−</button>
      <span id="zoomLabel">100%</span>
      <button id="zoomIn">+</button>
      <button id="zoomFit" title="화면에 맞추기">⤢</button>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <aside class="panel" id="panel"></aside>
</div>

<!-- Child modal -->
<div class="modal-backdrop" id="childModal">
  <div class="modal">
    <h3>자녀 추가</h3>
    <div class="field">
      <label>성별</label>
      <div class="seg" id="childGenderSeg">
        <button data-v="male" class="active">남성</button>
        <button data-v="female">여성</button>
      </div>
    </div>
    <div class="field">
      <label>이름 (선택)</label>
      <input class="mini" id="childName" placeholder="예: 첫째 아들">
    </div>
    <div class="field-row">
      <div class="field"><label>출생년도</label><input class="mini" id="childBirth" placeholder="예: 1998"></div>
    </div>
    <div class="field">
      <label>출생 유형</label>
      <div class="seg" id="childTypeSeg">
        <button data-v="bio" class="active">친자</button>
        <button data-v="adopted">입양</button>
        <button data-v="foster">위탁</button>
        <button data-v="stillborn">사산</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="childCancel">취소</button>
      <button class="btn primary" id="childConfirm">추가</button>
    </div>
  </div>
</div>

<script>
(function(){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('stage');
  const layerChild = document.getElementById('layerChild');
  const layerHousehold = document.getElementById('layerHousehold');
  const layerCouple = document.getElementById('layerCouple');
  const layerBond = document.getElementById('layerBond');
  const layerEco = document.getElementById('layerEco');
  const layerPending = document.getElementById('layerPending');
  const layerNodes = document.getElementById('layerNodes');
  const canvasWrap = document.getElementById('canvasWrap');
  const panel = document.getElementById('panel');
  const hintBanner = document.getElementById('hintBanner');
  const saveStatus = document.getElementById('saveStatus');

  const RECT = 62, CIRC = 32, ANCHOR_R = 34, GEN_GAP = 210;
  const SYS_R_DEFAULT = 46, SYS_R_MIN = 24, SYS_R_MAX = 170;
  const HH_R_DEFAULT = 150, HH_R_MIN = 50, HH_R_MAX = 320;

  let state = {
    nodes: [],
    edges: [],
    children: [], // {id, parentEdgeId, parentSingleId, childId, ctype}
    zoom: 1
  };
  let nextId = 1;
  const uid = () => 'n' + (nextId++);

  let tool = 'select';
  let pendingFrom = null;
  let selected = {type:null, id:null};
  let dragging = null; // {id, offsetX, offsetY}
  let resizing = null; // {id} — for system-node circle resize handle
  let saveTimer = null;

  // ---------- custom confirm modal (native confirm() is blocked inside the sandboxed artifact frame) ----------
  const confirmBackdrop = document.createElement('div');
  confirmBackdrop.className = 'modal-backdrop';
  confirmBackdrop.innerHTML = `
    <div class="modal">
      <h3 id="confirmMsg"></h3>
      <div class="modal-actions">
        <button class="btn" id="confirmCancel">취소</button>
        <button class="btn danger" id="confirmOk">확인</button>
      </div>
    </div>`;
  document.body.appendChild(confirmBackdrop);
  function askConfirm(message){
    return new Promise(resolve=>{
      confirmBackdrop.querySelector('#confirmMsg').textContent = message;
      confirmBackdrop.classList.add('open');
      const okBtn = confirmBackdrop.querySelector('#confirmOk');
      const cancelBtn = confirmBackdrop.querySelector('#confirmCancel');
      function cleanup(result){
        confirmBackdrop.classList.remove('open');
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        resolve(result);
      }
      function onOk(){ cleanup(true); }
      function onCancel(){ cleanup(false); }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
    });
  }

  // ---------- persistence ----------
  async function load(){
    try{
      const raw = localStorage.getItem('genogram-data');
      if(raw){
        const parsed = JSON.parse(raw);
        state = Object.assign({nodes:[],edges:[],children:[],zoom:1}, parsed);
        nextId = 1;
        [...state.nodes, ...state.edges, ...state.children].forEach(o=>{
          const n = parseInt((o.id||'n0').slice(1));
          if(!isNaN(n) && n >= nextId) nextId = n+1;
        });
        saveStatus.textContent = '불러옴 · 자동저장 켜짐';
      } else {
        saveStatus.textContent = '자동저장 켜짐';
      }
    }catch(e){
      saveStatus.textContent = '자동저장 켜짐';
    }
    applyZoom();
    render();
    if(window.innerWidth<=900) setTimeout(fitToScreen, 50);
  }
  function save(){
    saveStatus.textContent = '저장 중…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      try{
        localStorage.setItem('genogram-data', JSON.stringify(state));
        saveStatus.textContent = '저장됨 · ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      }catch(e){
        saveStatus.textContent = '저장 실패 (브라우저 저장공간 확인 필요)';
      }
    }, 700);
  }

  // ---------- helpers ----------
  function svgPoint(clientX, clientY){
    const pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    const ctm = svg.getScreenCTM().inverse();
    return pt.matrixTransform(ctm);
  }
  function nodeById(id){ return state.nodes.find(n=>n.id===id); }
  function edgeById(id){ return state.edges.find(e=>e.id===id); }
  function el(tag, attrs, ns){
    const e = document.createElementNS(NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function clearLayer(l){ while(l.firstChild) l.removeChild(l.firstChild); }

  function anchorPoint(node, tx, ty){
    const dx = tx - node.x, dy = ty - node.y;
    const dist = Math.hypot(dx,dy) || 1;
    const reach = (node.type==='system'||node.type==='household') ? (node.r||SYS_R_DEFAULT) : ANCHOR_R;
    return { x: node.x + dx/dist*reach, y: node.y + dy/dist*reach };
  }

  // ---------- node shape rendering ----------
  function quadrantPaths(node){
    const cx = node.x, cy = node.y;
    if(node.type.startsWith('female')){
      const r = node.type.endsWith('client') ? CIRC-4 : CIRC;
      const top=[cx,cy-r], right=[cx+r,cy], bottom=[cx,cy+r], left=[cx-r,cy];
      const p = (a,b)=>`M ${cx} ${cy} L ${a[0]} ${a[1]} A ${r} ${r} 0 0 1 ${b[0]} ${b[1]} Z`;
      return { TR:p(top,right), BR:p(right,bottom), BL:p(bottom,left), TL:p(left,top) };
    } else {
      const half = (node.type.endsWith('client') ? RECT-8 : RECT)/2;
      return {
        TL:`M ${cx-half} ${cy-half} h ${half} v ${half} h ${-half} Z`,
        TR:`M ${cx} ${cy-half} h ${half} v ${half} h ${-half} Z`,
        BL:`M ${cx-half} ${cy} h ${half} v ${half} h ${-half} Z`,
        BR:`M ${cx} ${cy} h ${half} v ${half} h ${-half} Z`
      };
    }
  }

  function drawNode(node){
    if(node.type === 'system') return drawSystemNode(node);
    if(node.type === 'household') return; // rendered separately in the household layer, see renderCanvas()
    const g = el('g', {class:'node-group', 'data-id':node.id, transform:`translate(0,0)`});
    const isFemale = node.type.startsWith('female');
    const isClient = node.type.endsWith('client');
    const cls = 'node-shape ' + (isFemale?'female':'male') + (selected.type==='node' && selected.id===node.id ? ' selected':'');

    // 1) base shape (fill + stroke)
    const shapeAttrs = [];
    if(isFemale){
      if(isClient){
        shapeAttrs.push({tag:'circle', attrs:{cx:node.x, cy:node.y, r:CIRC, class:cls, 'stroke-width':1.6}});
        shapeAttrs.push({tag:'circle', attrs:{cx:node.x, cy:node.y, r:CIRC-6, class:cls}});
      } else {
        shapeAttrs.push({tag:'circle', attrs:{cx:node.x, cy:node.y, r:CIRC, class:cls}});
      }
    } else {
      const half = RECT/2;
      if(isClient){
        shapeAttrs.push({tag:'rect', attrs:{x:node.x-half-4, y:node.y-half-4, width:RECT+8, height:RECT+8, class:cls, 'stroke-width':1.6}});
        shapeAttrs.push({tag:'rect', attrs:{x:node.x-half+2, y:node.y-half+2, width:RECT-4, height:RECT-4, class:cls}});
      } else {
        shapeAttrs.push({tag:'rect', attrs:{x:node.x-half, y:node.y-half, width:RECT, height:RECT, class:cls}});
      }
    }
    shapeAttrs.forEach(s=> g.appendChild(el(s.tag, Object.assign({}, s.attrs, {fill:'#fff'}))));

    // 2) quadrant fills (mental/physical = TL+BL, substance = BL+BR) — drawn on top of the white fill
    if(node.mental || node.substance){
      const q = quadrantPaths(node);
      if(node.mental){
        g.appendChild(el('path', {d:q.TL, class:'quad-fill'}));
        g.appendChild(el('path', {d:q.BL, class:'quad-fill'}));
      }
      if(node.substance){
        g.appendChild(el('path', {d:q.BL, class:'quad-fill'}));
        g.appendChild(el('path', {d:q.BR, class:'quad-fill'}));
      }
    }

    // 3) redraw outline only (no fill) on top so the border stays visible above any fill
    // NOTE: use an inline style (not a plain "fill" attribute) because the .node-shape CSS
    // class sets fill:#fff and a stylesheet class always wins over a presentation attribute.
    shapeAttrs.forEach(s=> g.appendChild(el(s.tag, Object.assign({}, s.attrs, {style:'fill:none'}))));

    // death X
    if(node.dead){
      const r = (isFemale?CIRC:RECT/2) * 0.92;
      g.appendChild(el('line',{x1:node.x-r,y1:node.y-r,x2:node.x+r,y2:node.y+r, stroke:'#1F2933','stroke-width':2}));
      g.appendChild(el('line',{x1:node.x+r,y1:node.y-r,x2:node.x-r,y2:node.y+r, stroke:'#1F2933','stroke-width':2}));
    }

    const off = isFemale ? CIRC : RECT/2;
    if(node.birth){
      const t = el('text',{x:node.x-off-8, y:node.y+4, 'text-anchor':'end', class:'node-label-year'});
      t.textContent = node.birth; g.appendChild(t);
    }
    if(node.dead && node.death){
      const t = el('text',{x:node.x+off+8, y:node.y+4, 'text-anchor':'start', class:'node-label-year'});
      t.textContent = node.death; g.appendChild(t);
    }
    const nameY = node.y + off + 18;
    const nt = el('text',{x:node.x, y:nameY, 'text-anchor':'middle', class:'node-label-name'});
    nt.textContent = node.name || '(이름 없음)'; g.appendChild(nt);

    g.addEventListener('pointerdown', (e)=> onNodeMouseDown(e, node));
    layerNodes.appendChild(g);
  }

  function drawSystemNode(node){
    const g = el('g', {class:'node-group', 'data-id':node.id});
    const r = node.r || SYS_R_DEFAULT;
    const isSel = selected.type==='node' && selected.id===node.id;
    const circAttrs = {cx:node.x, cy:node.y, r, fill:'#fff'};
    g.appendChild(el('circle', circAttrs));
    const strokeStyle = 'stroke:' + (isSel ? '#2F6F5E' : '#1F2933') + '; stroke-width:' + (isSel?2.6:2) + ';'
      + (node.borderStyle==='dashed' ? ' stroke-dasharray:6 4;' : '');
    g.appendChild(el('circle', Object.assign({}, circAttrs, {style:'fill:none; '+strokeStyle})));

    // wrapped text centered inside the circle
    const fontSize = node.fontSize || 12;
    const lines = (node.text || '체계').split('\n').filter(l=>l.length>0);
    const shown = lines.length ? lines : [''];
    const lineH = fontSize * 1.25;
    const startY = node.y - ((shown.length-1)*lineH)/2;
    const txt = el('text', {x:node.x, y:startY, 'text-anchor':'middle', style:`font-family:'Noto Sans KR',sans-serif; font-size:${fontSize}px; font-weight:600; fill:#1F2933;`});
    shown.forEach((line,i)=>{
      const tspan = el('tspan', {x:node.x, y:startY + i*lineH});
      tspan.textContent = line;
      txt.appendChild(tspan);
    });
    g.appendChild(txt);

    g.addEventListener('pointerdown', (e)=> onNodeMouseDown(e, node));
    layerNodes.appendChild(g);

    if(isSel) attachResizeHandle(node, r, layerNodes);
  }

  function drawHouseholdNode(node){
    const g = el('g', {class:'node-group', 'data-id':node.id});
    const r = node.r || HH_R_DEFAULT;
    const isSel = selected.type==='node' && selected.id===node.id;
    const strokeStyle = 'stroke:' + (isSel ? '#2F6F5E' : '#8A93A6') + '; stroke-width:' + (isSel?2.4:1.8) + ';'
      + (node.borderStyle==='dashed' ? ' stroke-dasharray:9 6;' : '');
    // fill:none on purpose — this circle is only ever a transparent boundary ring,
    // so it never covers the genogram/ecomap drawn underneath it.
    const ring = el('circle', {cx:node.x, cy:node.y, r, style:'fill:none; '+strokeStyle});
    g.appendChild(ring);

    g.addEventListener('pointerdown', (e)=> onNodeMouseDown(e, node));
    layerHousehold.appendChild(g);

    if(isSel) attachResizeHandle(node, r, layerHousehold);
  }

  function attachResizeHandle(node, r, targetLayer){
    const hx = node.x + r*Math.cos(Math.PI/4), hy = node.y + r*Math.sin(Math.PI/4);
    const handle = el('circle', {cx:hx, cy:hy, r:7, fill:'#2F6F5E', stroke:'#fff', 'stroke-width':2, style:'cursor:nwse-resize;'});
    handle.addEventListener('pointerdown', e=>{
      e.stopPropagation(); e.preventDefault();
      resizing = {id:node.id};
      document.addEventListener('pointermove', onResizeMove);
      document.addEventListener('pointerup', onResizeEnd);
      document.addEventListener('pointercancel', onResizeEnd);
    });
    targetLayer.appendChild(handle);
  }
  function onResizeMove(e){
    if(!resizing) return;
    const n = nodeById(resizing.id);
    if(!n) return;
    const pt = svgPoint(e.clientX, e.clientY);
    const [minR, maxR] = n.type==='household' ? [HH_R_MIN, HH_R_MAX] : [SYS_R_MIN, SYS_R_MAX];
    n.r = Math.max(minR, Math.min(maxR, Math.hypot(pt.x-n.x, pt.y-n.y)));
    renderCanvas();
  }
  function onResizeEnd(){
    resizing = null;
    document.removeEventListener('pointermove', onResizeMove);
    document.removeEventListener('pointerup', onResizeEnd);
    document.removeEventListener('pointercancel', onResizeEnd);
    save();
  }

  // ---------- edge (couple) rendering ----------
  function drawCoupleEdge(edge){
    const a = nodeById(edge.from), b = nodeById(edge.to);
    if(!a || !b) return;
    const p1 = anchorPoint(a, b.x, b.y), p2 = anchorPoint(b, a.x, a.y);
    const midX = (p1.x+p2.x)/2, midY = (p1.y+p2.y)/2;
    const dash = edge.kind==='cohabit' ? '6 5' : null;
    const isSel = selected.type==='edge' && selected.id===edge.id;

    const hit = el('path',{d:`M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`, class:'edge-hit', 'data-id':edge.id});
    hit.addEventListener('click', (e)=>{ e.stopPropagation(); selectEdge(edge.id); });
    layerCouple.appendChild(hit);

    const lineAttrs = {d:`M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`, class:'edge-line' + (isSel?' selected':'')};
    if(dash) lineAttrs['stroke-dasharray'] = dash;
    layerCouple.appendChild(el('path', lineAttrs));

    // separation/divorce slashes
    const angle = Math.atan2(p2.y-p1.y, p2.x-p1.x);
    const perp = angle + Math.PI/2;
    function slash(cx){
      const l = 11;
      const x1 = cx.x + Math.cos(perp)*l*0.6 - Math.cos(angle)*4;
      const y1 = cx.y + Math.sin(perp)*l*0.6 - Math.sin(angle)*4;
      const x2 = cx.x - Math.cos(perp)*l*0.6 - Math.cos(angle)*4;
      const y2 = cx.y - Math.sin(perp)*l*0.6 - Math.sin(angle)*4;
      layerCouple.appendChild(el('line',{x1,y1,x2,y2, stroke:'var(--ink)', 'stroke-width':2}));
    }
    if(edge.kind==='separated'){
      slash({x:midX, y:midY});
    } else if(edge.kind==='divorced'){
      slash({x:midX-7*Math.cos(angle), y:midY-7*Math.sin(angle)});
      slash({x:midX+7*Math.cos(angle), y:midY+7*Math.sin(angle)});
    }

    // label
    const labelMap = {marriage:'m', cohabit:'동거', separated:'s', divorced:'d'};
    let label = labelMap[edge.kind] || '';
    if(edge.year && (edge.kind==='marriage'||edge.kind==='separated'||edge.kind==='divorced')) label += '.'+edge.year;
    if(edge.yearEnd && edge.kind==='divorced') label += ' d.'+edge.yearEnd;
    if(label){
      const t = el('text',{x:midX, y:midY-9, 'text-anchor':'middle', class:'edge-label'});
      t.textContent = label; layerCouple.appendChild(t);
    }
  }

  function drawBondEdge(edge){
    const a = nodeById(edge.from), b = nodeById(edge.to);
    if(!a || !b) return;
    const p1 = anchorPoint(a, b.x, b.y), p2 = anchorPoint(b, a.x, a.y);
    const angle = Math.atan2(p2.y-p1.y, p2.x-p1.x);
    const perp = angle + Math.PI/2;
    const isSel = selected.type==='edge' && selected.id===edge.id;

    const hit = el('path',{d:`M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`, class:'edge-hit'});
    hit.addEventListener('click', (e)=>{ e.stopPropagation(); selectEdge(edge.id); });
    layerBond.appendChild(hit);

    function offsetLine(off){
      const ox = Math.cos(perp)*off, oy = Math.sin(perp)*off;
      return `M ${p1.x+ox} ${p1.y+oy} L ${p2.x+ox} ${p2.y+oy}`;
    }
    const baseAttrs = {class:'edge-line' + (isSel?' selected':''), 'stroke-width':1.6};

    if(edge.kind==='adequate'){
      layerBond.appendChild(el('path',Object.assign({d:offsetLine(0)},baseAttrs)));
    } else if(edge.kind==='close'){
      layerBond.appendChild(el('path',Object.assign({d:offsetLine(-2.5)},baseAttrs)));
      layerBond.appendChild(el('path',Object.assign({d:offsetLine(2.5)},baseAttrs)));
    } else if(edge.kind==='fused'){
      layerBond.appendChild(el('path',Object.assign({d:offsetLine(-4)},baseAttrs)));
      layerBond.appendChild(el('path',Object.assign({d:offsetLine(0)},baseAttrs)));
      layerBond.appendChild(el('path',Object.assign({d:offsetLine(4)},baseAttrs)));
    } else if(edge.kind==='conflict'){
      const steps=6, pts=[];
      for(let i=0;i<=steps;i++){
        const t=i/steps;
        const bx = p1.x+(p2.x-p1.x)*t, by = p1.y+(p2.y-p1.y)*t;
        const zig = (i%2===0? -5:5);
        pts.push(`${bx+Math.cos(perp)*zig},${by+Math.sin(perp)*zig}`);
      }
      layerBond.appendChild(el('polyline',Object.assign({points:pts.join(' ')},baseAttrs)));
    } else if(edge.kind==='distant'){
      layerBond.appendChild(el('path',Object.assign({d:offsetLine(0), 'stroke-dasharray':'2 4'},baseAttrs)));
    } else if(edge.kind==='cutoff'){
      layerBond.appendChild(el('path',Object.assign({d:offsetLine(0), 'stroke-dasharray':'6 4'},baseAttrs)));
      const midX=(p1.x+p2.x)/2, midY=(p1.y+p2.y)/2;
      [-6,6].forEach(off=>{
        const cx=midX+Math.cos(angle)*off, cy=midY+Math.sin(angle)*off;
        const x1=cx+Math.cos(perp)*7, y1=cy+Math.sin(perp)*7;
        const x2=cx-Math.cos(perp)*7, y2=cy-Math.sin(perp)*7;
        layerBond.appendChild(el('line',{x1,y1,x2,y2, stroke:'var(--ink)', 'stroke-width':1.6}));
      });
    }
  }

  const bondLabels = {adequate:'적절',close:'친밀',fused:'융합',conflict:'갈등',distant:'소원',cutoff:'단절'};
  const ecoStyleLabels = {solid:'실선', dashed:'점선', thick:'굵은 실선'};
  const ecoArrowLabels = {none:'없음', both:'양방향', left:'왼쪽', right:'오른쪽'};

  function drawEcoEdge(edge){
    const a = nodeById(edge.from), b = nodeById(edge.to);
    if(!a || !b) return;
    const p1 = anchorPoint(a, b.x, b.y), p2 = anchorPoint(b, a.x, a.y);
    const isSel = selected.type==='edge' && selected.id===edge.id;

    const hit = el('path',{d:`M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`, class:'edge-hit'});
    hit.addEventListener('click', (e)=>{ e.stopPropagation(); selectEdge(edge.id); });
    layerEco.appendChild(hit);

    let styleStr = 'stroke:' + (isSel ? '#2F6F5E' : '#1F2933') + '; fill:none;';
    styleStr += edge.lineStyle==='thick' ? ' stroke-width:4.5;' : ' stroke-width:2;';
    if(edge.lineStyle==='dashed') styleStr += ' stroke-dasharray:7 5;';

    const attrs = {d:`M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`, style:styleStr};
    if(edge.arrow==='both'){ attrs['marker-start']='url(#ecoArrow)'; attrs['marker-end']='url(#ecoArrow)'; }
    else if(edge.arrow==='left'){ attrs['marker-start']='url(#ecoArrow)'; }
    else if(edge.arrow==='right'){ attrs['marker-end']='url(#ecoArrow)'; }
    layerEco.appendChild(el('path', attrs));
  }

  // ---------- children rendering ----------
  function drawChildren(){
    // group children by parentEdgeId or parentSingleId
    const byEdge = {};
    const bySingle = {};
    state.children.forEach(c=>{
      if(c.parentEdgeId){ (byEdge[c.parentEdgeId] = byEdge[c.parentEdgeId]||[]).push(c); }
      else if(c.parentSingleId){ (bySingle[c.parentSingleId] = bySingle[c.parentSingleId]||[]).push(c); }
    });

    Object.keys(byEdge).forEach(edgeId=>{
      const edge = edgeById(edgeId);
      if(!edge) return;
      const a = nodeById(edge.from), b = nodeById(edge.to);
      if(!a||!b) return;
      const midX = (a.x+b.x)/2, midY = (a.y+b.y)/2;
      const kids = byEdge[edgeId];
      const busY = midY + GEN_GAP*0.55;
      const xs = kids.map(c=>nodeById(c.childId)).filter(Boolean);
      if(xs.length===0) return;
      const minX = Math.min(...xs.map(n=>n.x), midX);
      const maxX = Math.max(...xs.map(n=>n.x), midX);
      layerChild.appendChild(el('path',{d:`M ${midX} ${midY} L ${midX} ${busY}`, class:'child-line'}));
      layerChild.appendChild(el('path',{d:`M ${minX} ${busY} L ${maxX} ${busY}`, class:'child-line'}));
      kids.forEach(c=>{
        const cn = nodeById(c.childId);
        if(!cn) return;
        drawChildDrop(cn.x, busY, cn, c.ctype);
      });
    });

    Object.keys(bySingle).forEach(pid=>{
      const p = nodeById(pid);
      if(!p) return;
      const kids = bySingle[pid];
      kids.forEach(c=>{
        const cn = nodeById(c.childId);
        if(!cn) return;
        const topY = p.y + RECT/2 + 4;
        layerChild.appendChild(el('path',{d:`M ${p.x} ${topY} L ${p.x} ${p.y+30} L ${cn.x} ${p.y+30}`, class:'child-line'}));
        drawChildDrop(cn.x, p.y+30, cn, c.ctype);
      });
    });
  }
  function drawChildDrop(x, busY, childNode, ctype){

  document.querySelectorAll('.pal-item').forEach(item=>{
    let startX=0, startY=0, moved=false, ghost=null, addType=null;
    const THRESHOLD = 8;

    item.addEventListener('pointerdown', e=>{
      addType = item.dataset.add;
      startX = e.clientX; startY = e.clientY; moved = false;
      item.setPointerCapture(e.pointerId);
      item.addEventListener('pointermove', onMove);
      item.addEventListener('pointerup', onUp);
      item.addEventListener('pointercancel', onCancel);
    });

    function onMove(e){
      const dx = e.clientX-startX, dy = e.clientY-startY;
      if(!moved && Math.hypot(dx,dy) > THRESHOLD){
        moved = true;
        ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.innerHTML = item.querySelector('svg').outerHTML;
        document.body.appendChild(ghost);
        canvasWrap.classList.add('dragover');
      }
      if(ghost){ ghost.style.left = e.clientX+'px'; ghost.style.top = e.clientY+'px'; }
    }

    function cleanup(){
      item.removeEventListener('pointermove', onMove);
      item.removeEventListener('pointerup', onUp);
      item.removeEventListener('pointercancel', onCancel);
      if(ghost){ ghost.remove(); ghost=null; }
      canvasWrap.classList.remove('dragover');
      closeRailOnMobile();
    }

    function onUp(e){
      const wrapRect = canvasWrap.getBoundingClientRect();
      const overCanvas = e.clientX>=wrapRect.left && e.clientX<=wrapRect.right && e.clientY>=wrapRect.top && e.clientY<=wrapRect.bottom;
      if(moved && overCanvas){
        const pt = svgPoint(e.clientX, e.clientY);
        addNode(addType, pt.x, pt.y);
      } else if(!moved){
        // simple tap: drop the shape in the middle of the currently visible canvas area
        const cx = wrapRect.left + wrapRect.width/2;
        const cy = wrapRect.top + wrapRect.height/2;
        const pt = svgPoint(cx, cy);
        addNode(addType, pt.x, pt.y);
      }
      cleanup();
    }
    function onCancel(){ cleanup(); }
  });

    if(tool.startsWith('couple:') || tool.startsWith('bond:') || tool.startsWith('eco:')){
      hintBanner.style.display='block';
      let label;
      if(tool.startsWith('couple:')) label = {marriage:'결혼',cohabit:'동거',separated:'별거',divorced:'이혼'}[tool.split(':')[1]];
      else if(tool.startsWith('bond:')) label = bondLabels[tool.split(':')[1]];
      else { const [,ls,ar] = tool.split(':'); label = `생태도 · ${ecoStyleLabels[ls]}/${ecoArrowLabels[ar]}`; }
      hintBanner.textContent = pendingFrom

  document.addEventListener('keydown', e=>{

  function onNodeMouseDown(e, node){
    e.stopPropagation();
    e.preventDefault();
    if(tool==='select'){
      selectNode(node.id);
      const pt = svgPoint(e.clientX, e.clientY);
      dragging = {id:node.id, dx:pt.x-node.x, dy:pt.y-node.y, pointerId:e.pointerId};
      document.addEventListener('pointermove', onDragMove);
      document.addEventListener('pointerup', onDragEnd);
      document.addEventListener('pointercancel', onDragEnd);
    } else if(tool.startsWith('couple:') || tool.startsWith('bond:') || tool.startsWith('eco:')){
      if(!pendingFrom){
        pendingFrom = node.id;
        updateHint();
      } else if(pendingFrom !== node.id){
        const parts = tool.split(':');
        const category = parts[0];
        // if a connection of this category already exists between the same two nodes,
        // update it in place instead of adding a duplicate line on top of it
        let edge = state.edges.find(ed => ed.category===category &&
          ((ed.from===pendingFrom && ed.to===node.id) || (ed.from===node.id && ed.to===pendingFrom)));
        if(edge){
          if(category==='eco'){
            edge.lineStyle = parts[1]; edge.arrow = parts[2];
          } else {
            edge.kind = parts[1];
            if(category==='couple' && edge.kind==='cohabit'){ edge.year=''; edge.yearEnd=''; }
          }
        } else {
          if(category==='eco'){
            edge = {id:uid(), category, lineStyle:parts[1], arrow:parts[2], from:pendingFrom, to:node.id};
          } else {
            edge = {id:uid(), category, kind:parts[1], from:pendingFrom, to:node.id, year:'', yearEnd:''};
          }
          state.edges.push(edge);
        }
        pendingFrom = null;
        selectEdge(edge.id);
        save();
      } else {
        pendingFrom = null;
      }
      render();
    }
  }
  function onDragMove(e){
    if(!dragging) return;
    const pt = svgPoint(e.clientX, e.clientY);
    const n = nodeById(dragging.id);
    if(!n) return;
    n.x = pt.x - dragging.dx;
    n.y = pt.y - dragging.dy;
    renderCanvas();
  }
  function onDragEnd(){
    dragging = null;
    document.removeEventListener('pointermove', onDragMove);
    document.removeEventListener('pointerup', onDragEnd);
    document.removeEventListener('pointercancel', onDragEnd);

  function selectNode(id){ selected = {type:'node', id}; render(); }

  function deleteSelected(){
    if(selected.type==='node'){
      const id = selected.id;
      state.nodes = state.nodes.filter(n=>n.id!==id);
      state.edges = state.edges.filter(e=>e.from!==id && e.to!==id);
      state.children = state.children.filter(c=>{
        if(c.childId===id) return false;
        if(c.parentSingleId===id) return false;
        return true;
      });
      // remove children whose parentEdge no longer exists
      const edgeIds = new Set(state.edges.map(e=>e.id));
      state.children = state.children.filter(c=> !c.parentEdgeId || edgeIds.has(c.parentEdgeId));
      selected = {type:null,id:null};
      render(); save();
    } else if(selected.type==='edge'){
      const id = selected.id;
      state.edges = state.edges.filter(e=>e.id!==id);
      state.children = state.children.filter(c=>c.parentEdgeId!==id);
      selected = {type:null,id:null};
      render(); save();
    }
  }

  function renderPanel(){
    panel.classList.toggle('open', selected.type!==null);

      panel.appendChild(fieldsForNode(n));
    } else if(selected.type==='edge'){
      const ed = edgeById(selected.id);
      if(!ed){ panel.classList.remove('open'); return; }
      panel.appendChild(fieldsForEdge(ed));
    }
  }

    if(childCtx.parentEdgeId){
      const ed = edgeById(childCtx.parentEdgeId);
      const a = nodeById(ed.from), b = nodeById(ed.to);
      baseX = (a.x+b.x)/2; baseY = (a.y+b.y)/2;
      const existing = state.children.filter(c=>c.parentEdgeId===ed.id).length;
      baseX += (existing - existing) * 0; // placeholder
      const n = addChildNode(childGender, name, birth, baseX, baseY, existing);
      state.children.push({id:uid(), parentEdgeId:ed.id, childId:n.id, ctype:childType});
    } else {
      const p = nodeById(childCtx.parentSingleId);
      const existing = state.children.filter(c=>c.parentSingleId===p.id).length;
      const n = addChildNode(childGender, name, birth, p.x, p.y, existing);
      state.children.push({id:uid(), parentSingleId:p.id, childId:n.id, ctype:childType});
    }
    childModal.classList.remove('open');
    render(); save();
  });
  function addChildNode(gender, name, birth, baseX, baseY, existingCount){
    const spacing = 100;
    const offset = (existingCount % 2===0 ? 1:-1) * Math.ceil((existingCount+1)/2) * spacing;
    const x = baseX + (existingCount===0?0:offset);
    const y = baseY + GEN_GAP;
    const n = {id:uid(), type:gender, x, y, name, birth, death:'', dead:(false), mental:false, substance:false};
    if(childType==='stillborn'){ n.dead=true; n.death=birth; }
    state.nodes.push(n);
    return n;
  }

  // ---------- zoom ----------
  function applyZoom(){
    svg.style.width = (1700*state.zoom)+'px';
    svg.style.height = (1150*state.zoom)+'px';
    document.getElementById('zoomLabel').textContent = Math.round(state.zoom*100)+'%';
  }
  function fitToScreen(){
    const rect = canvasWrap.getBoundingClientRect();
    if(rect.width < 10 || rect.height < 10) return;
    const zx = (rect.width-16) / 1700;
    const zy = (rect.height-16) / 1150;
    state.zoom = Math.max(0.15, Math.min(zx, zy));
    applyZoom();
    canvasWrap.scrollLeft = 0; canvasWrap.scrollTop = 0;
    save();
  }
  document.getElementById('zoomIn').addEventListener('click', ()=>{ state.zoom = Math.min(2, state.zoom+0.1); applyZoom(); save(); });
  document.getElementById('zoomOut').addEventListener('click', ()=>{ state.zoom = Math.max(0.15, state.zoom-0.1); applyZoom(); save(); });
  document.getElementById('zoomFit').addEventListener('click', fitToScreen);

  let resizeTimer=null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{ if(window.innerWidth<=900) fitToScreen(); }, 250);
  });


  // ---------- export PNG ----------
  const EXPORT_STYLE = `
    .node-shape{fill:#fff; stroke:#1F2933; stroke-width:2.4;}
    .node-shape.male{stroke:#2B3A55;}
    .node-shape.female{stroke:#7A3B69;}
    .node-shape.selected{stroke:#2F6F5E; stroke-width:3.2;}
    .quad-fill{fill:#1F2933; opacity:.82;}
    .node-label-name{font-family:'Noto Sans KR',sans-serif; font-size:13px; font-weight:700; fill:#1F2933;}
    .node-label-year{font-family:'IBM Plex Mono',monospace; font-size:10.5px; fill:#5B6672;}
    .edge-line{fill:none; stroke:#1F2933; stroke-width:2;}
    .edge-line.selected{stroke:#2F6F5E;}
    .edge-hit{fill:none; stroke:transparent; stroke-width:14;}
    .edge-label{font-family:'IBM Plex Mono',monospace; font-size:10px; fill:#5B6672;}
    .child-line{fill:none; stroke:#1F2933; stroke-width:2;}
  `;

  const exportModal = document.createElement('div');
  exportModal.className = 'modal-backdrop';
  exportModal.innerHTML = `
    <div class="modal" style="width:auto; max-width:90vw;">
      <h3>이미지 저장</h3>
      <p id="exportNote" style="font-size:12px; color:var(--ink-soft); margin:0 0 10px;">자동 다운로드가 시작되지 않으면, 아래 이미지를 <b>길게 눌러 저장</b>(모바일) 하거나 <b>마우스 오른쪽 버튼 → 이미지를 다른 이름으로 저장</b>(PC) 하세요.</p>
      <div style="max-height:55vh; overflow:auto; border:1px solid var(--line); border-radius:8px;">
        <img id="exportImg" style="width:100%; display:block;">
      </div>
      <div class="modal-actions">
        <button class="btn" id="exportOpenTab">새 탭에서 열기</button>
        <button class="btn primary" id="exportClose">닫기</button>
      </div>
    </div>`;
  document.body.appendChild(exportModal);
  exportModal.querySelector('#exportClose').addEventListener('click', ()=> exportModal.classList.remove('open'));

  function computeContentBounds(){
    if(state.nodes.length===0) return null;
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    state.nodes.forEach(n=>{
      let left, right, top, bottom;
      if(n.type==='system' || n.type==='household'){
        const r = (n.r || (n.type==='system'?SYS_R_DEFAULT:HH_R_DEFAULT)) + 6;
        left = right = top = bottom = r;
      } else {
        const isFemale = n.type.startsWith('female');
        const off = (isFemale?CIRC:RECT/2) + 6;
        left = off + 42; right = off + 42; top = off + 6; bottom = off + 34;
      }
      minX = Math.min(minX, n.x-left);
      maxX = Math.max(maxX, n.x+right);
      minY = Math.min(minY, n.y-top);
      maxY = Math.max(maxY, n.y+bottom);
    });
    return {minX, minY, maxX, maxY};
  }

  document.getElementById('btnExport').addEventListener('click', ()=>{
    saveStatus.textContent = '이미지 생성 중…';

    // crop to the actual drawn content instead of exporting the whole (mostly empty) canvas
    const PAD = 44;
    const bounds = computeContentBounds();
    let cropX=0, cropY=0, cropW=1700, cropH=1150;
    if(bounds){
      cropX = Math.max(0, Math.floor(bounds.minX - PAD));
      cropY = Math.max(0, Math.floor(bounds.minY - PAD));
      const x1 = Math.min(1700, Math.ceil(bounds.maxX + PAD));
      const y1 = Math.min(1150, Math.ceil(bounds.maxY + PAD));
      cropW = Math.max(160, x1 - cropX);
      cropH = Math.max(160, y1 - cropY);
    }

    const clone = svg.cloneNode(true);
    clone.setAttribute('viewBox', `${cropX} ${cropY} ${cropW} ${cropH}`);
    clone.setAttribute('width', cropW); clone.setAttribute('height', cropH);
    clone.removeAttribute('style');
    const styleEl = document.createElementNS(NS, 'style');
    styleEl.textContent = EXPORT_STYLE;
    clone.insertBefore(styleEl, clone.firstChild);
    const bg = el('rect', {x:cropX, y:cropY, width:cropW, height:cropH, fill:'#ffffff'});
    clone.insertBefore(bg, clone.firstChild);

    const xml = new XMLSerializer().serializeToString(clone);
    // Use a base64 data URI instead of a Blob object URL — some in-app browsers
    // (e.g. Naver / Kakao's built-in browser) block blob: URLs for security reasons.
    let svgDataUrl;
    try{
      svgDataUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
    }catch(e){
      saveStatus.textContent = '이미지 생성 실패';
      alertFallback('이 브라우저에서는 이미지를 만들 수 없습니다. Chrome이나 삼성 인터넷 같은 기본 브라우저에서 다시 열어 시도해 주세요.', null);
      return;
    }

    const img = new Image();
    img.onload = ()=>{
      try{
        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = cropW*scale; canvas.height = cropH*scale;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img, 0,0, canvas.width, canvas.height);
        const pngDataUrl = canvas.toDataURL('image/png');
        showExportResult(pngDataUrl, '가계도.png');
      }catch(err){
        // canvas conversion failed (e.g. tainted-canvas restriction) — fall back to
        // showing the SVG picture directly, which still works without canvas at all.
        showExportResult(svgDataUrl, '가계도.svg', true);
      }
    };
    img.onerror = ()=>{
      // even loading the SVG as an image failed — show it directly as a last resort
      showExportResult(svgDataUrl, '가계도.svg', true);
    };
    img.src = svgDataUrl;
  });

  function showExportResult(dataUrl, filename, isFallback){
    // try a direct file download first (works on most normal browsers)
    try{
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }catch(e){ /* ignore — the modal below covers this case */ }

    // always show the image too, in case the automatic download above was blocked
    const imgEl = exportModal.querySelector('#exportImg');
    imgEl.src = dataUrl;
    exportModal.querySelector('h3').textContent = isFallback ? '이미지 저장 (대체 방식)' : '이미지 저장';
    exportModal.querySelector('#exportNote').textContent = isFallback
      ? '이 브라우저에서는 고화질 변환이 지원되지 않아, 원본 그림을 그대로 보여드립니다. 아래 그림을 길게 눌러 저장(모바일) 하거나 마우스 오른쪽 버튼 → 이미지를 다른 이름으로 저장(PC) 하세요.'
      : '자동 다운로드가 시작되지 않으면, 아래 이미지를 길게 눌러 저장(모바일) 하거나 마우스 오른쪽 버튼 → 이미지를 다른 이름으로 저장(PC) 하세요.';
    exportModal.querySelector('#exportOpenTab').onclick = ()=>{
      const w = window.open();
      if(w){ w.document.write('<img src="'+dataUrl+'" style="max-width:100%;">'); }
      else { alertFallback('새 창 열기가 차단되어 있습니다. 브라우저의 팝업 차단을 해제한 뒤 다시 시도해 주세요.'); }
    };
    exportModal.classList.add('open');
    saveStatus.textContent = isFallback ? '이미지 생성 완료(대체 방식)' : '이미지 생성 완료';
  }
  function alertFallback(msg){
    exportModal.querySelector('#exportImg').removeAttribute('src');
    exportModal.querySelector('h3').textContent = '알림';
    exportModal.querySelector('#exportNote').textContent = msg;
    exportModal.classList.add('open');
  }

  // ---------- reset ----------
  document.getElementById('btnReset').addEventListener('click', async ()=>{
    const ok = await askConfirm('현재 가계도를 모두 지우고 새로 시작할까요?');
    if(!ok) return;
    state = {nodes:[],edges:[],children:[],zoom:1};
    selected = {type:null,id:null};
    applyZoom(); render(); save();
    if(window.innerWidth<=900) setTimeout(fitToScreen, 50);
  });

  // ---------- 2-generation template ----------
  document.getElementById('btnTemplate2').addEventListener('click', async ()=>{
    if(state.nodes.length>0){
      const ok = await askConfirm('현재 캔버스 내용을 지우고 2세대 예시를 불러올까요?');
      if(!ok) return;
    }
    state = {nodes:[],edges:[],children:[],zoom:1};
    nextId = 1;

    // Generation 1: 부모
    const father = addSilent2('male', 800, 150, '아버지');
    const mother = addSilent2('female', 1030, 150, '어머니');
    const e1 = addEdgeSilent2('couple','marriage', father.id, mother.id, '1992');

    // Generation 2: 본인 + 형제자매
    const ct = addSilent2('male-client', 800, 150+GEN_GAP, '본인(CT)');
    const sibling = addSilent2('female', 1000, 150+GEN_GAP, '여동생');
    state.children.push({id:uid(), parentEdgeId:e1.id, childId:ct.id, ctype:'bio'});
    state.children.push({id:uid(), parentEdgeId:e1.id, childId:sibling.id, ctype:'bio'});

    applyZoom(); render(); save();
    if(window.innerWidth<=900) setTimeout(fitToScreen, 50);
    function addSilent2(type,x,y,name){
      const n = {id:uid(), type, x, y, name, birth:'', death:'', dead:false, mental:false, substance:false};
      state.nodes.push(n); return n;
    }
    function addEdgeSilent2(category,kind,from,to,year){
      const e = {id:uid(), category, kind, from, to, year:year||'', yearEnd:''};
      state.edges.push(e); return e;
    }
  });

  // ---------- 3-generation template ----------
  document.getElementById('btnTemplate').addEventListener('click', async ()=>{
    if(state.nodes.length>0){
      const ok = await askConfirm('현재 캔버스 내용을 지우고 3세대 예시를 불러올까요?');
      if(!ok) return;
    }
    state = {nodes:[],edges:[],children:[],zoom:1};
    nextId = 1;

    const gw = 260;
    // Generation 1
    const pgf = addSilent('male', 500, 130, '친조부');
    const pgm = addSilent('female', 500+gw, 130, '친조모');
    const mgf = addSilent('male', 1100, 130, '외조부');
    const mgm = addSilent('female', 1100+gw, 130, '외조모');
    const e1 = addEdgeSilent('couple','marriage', pgf.id, pgm.id, '1965');
    const e2 = addEdgeSilent('couple','marriage', mgf.id, mgm.id, '1968');

    // Generation 2
    const father = addSilent('male', 630, 130+GEN_GAP, '아버지', existingChildFor(e1.id, 0));
    const mother = addSilent('female', 1230, 130+GEN_GAP, '어머니');
    state.children.push({id:uid(), parentEdgeId:e1.id, childId:father.id, ctype:'bio'});
    state.children.push({id:uid(), parentEdgeId:e2.id, childId:mother.id, ctype:'bio'});
    const e3 = addEdgeSilent('couple','marriage', father.id, mother.id, '1992');

    // Generation 3
    const ct = addSilent('male-client', 830, 130+GEN_GAP*2, '본인(CT)');
    const sibling = addSilent('female', 1030, 130+GEN_GAP*2, '여동생');
    state.children.push({id:uid(), parentEdgeId:e3.id, childId:ct.id, ctype:'bio'});
    state.children.push({id:uid(), parentEdgeId:e3.id, childId:sibling.id, ctype:'bio'});

    applyZoom(); render(); save();
    if(window.innerWidth<=900) setTimeout(fitToScreen, 50);
    function addSilent(type,x,y,name){
      const n = {id:uid(), type, x, y, name, birth:'', death:'', dead:false, mental:false, substance:false};
      state.nodes.push(n); return n;
    }
    function addEdgeSilent(category,kind,from,to,year){
      const e = {id:uid(), category, kind, from, to, year:year||'', yearEnd:''};
      state.edges.push(e); return e;
    }
    function existingChildFor(){ return undefined; }
  });

  load();
})();
</script>
</body>
